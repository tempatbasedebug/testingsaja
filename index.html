<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Portfolio pribadi Raja">
  <title>Portfolio — Raja</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      --red: #e50914;
      --red-light: #ff2632;
      --black: #090909;
      --black-2: #111111;
      --gray: #a5a5a5;
      --white: #f5f5f5;
      --line: rgba(255, 255, 255, 0.09);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::selection {
      background: var(--red);
      color: white;
    }

    /* ================= NAVBAR ================= */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      padding: 20px 7%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      background: rgba(9, 9, 9, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .logo {
      font-family: "Space Grotesk", sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .logo span {
      color: var(--red);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #aaa;
    }

    .nav-dot {
      width: 7px;
      height: 7px;
      background: #35d07f;
      border-radius: 50%;
      box-shadow: 0 0 10px #35d07f;
    }

    /* ================= HERO ================= */

    .hero {
      min-height: calc(100vh - 65px);
      padding: 140px 7% 70px;

      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      align-items: center;
      gap: 60px;

      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";

      position: absolute;
      width: 600px;
      height: 600px;

      background: var(--red);
      filter: blur(170px);
      opacity: 0.13;

      right: -250px;
      top: 80px;

      pointer-events: none;
    }

    .hero::after {
      content: "";

      position: absolute;
      width: 250px;
      height: 250px;

      background: var(--red);
      filter: blur(130px);
      opacity: 0.08;

      left: -100px;
      bottom: -100px;

      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      color: var(--red-light);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-family: "Space Grotesk", sans-serif;

      font-size: clamp(50px, 7vw, 92px);

      line-height: 0.95;
      letter-spacing: -5px;

      max-width: 800px;
      margin-bottom: 30px;
    }

    .hero h1 span {
      color: var(--red);
    }

    .hero-description {
      color: var(--gray);
      max-width: 560px;
      font-size: 17px;
      margin-bottom: 35px;
    }

    /* ================= BUTTON ================= */

    .buttons {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 13px 22px;
      border-radius: 5px;

      font-size: 14px;
      font-weight: 600;

      transition: 0.25s;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: var(--red);
      color: white;
    }

    .btn-primary:hover {
      background: var(--red-light);
      transform: translateY(-2px);
    }

    .btn-outline {
      border-color: #333;
      color: #ddd;
    }

    .btn-outline:hover {
      border-color: var(--red);
      color: var(--red);
    }

    /* ================= PROFILE CARD ================= */

    .profile-wrap {
      display: flex;
      justify-content: center;

      position: relative;
      z-index: 2;
    }

    .profile-card {
      width: min(100%, 350px);

      background: var(--black-2);
      border: 1px solid var(--line);

      padding: 15px;

      transform: rotate(2deg);
      transition: 0.4s;
    }

    .profile-card:hover {
      transform: rotate(0deg) translateY(-8px);
      border-color: rgba(229, 9, 20, 0.5);
    }

    /* ================= FOTO ================= */

    .profile-image {
      width: 100%;
      height: 420px;

      background: #1a1a1a;

      overflow: hidden;
      position: relative;
    }

    .profile-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;
      display: block;

      transition: transform 0.5s ease;
    }

    .profile-card:hover .profile-image img {
      transform: scale(1.03);
    }

    /* ================= PROFILE INFO ================= */

    .profile-info {
      padding: 18px 5px 5px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .profile-info h3 {
      font-size: 16px;
    }

    .profile-info p {
      color: var(--gray);
      font-size: 12px;
    }

    .status {
      width: 9px;
      height: 9px;

      background: #35d07f;
      border-radius: 50%;

      box-shadow: 0 0 12px #35d07f;
    }

    /* ================= FOOTER ================= */

    footer {
      padding: 25px 7%;

      background: #080808;

      display: flex;
      justify-content: space-between;
      align-items: center;

      color: #666;
      font-size: 12px;

      border-top: 1px solid var(--line);
    }

    .socials {
      display: flex;
      gap: 20px;
    }

    .socials a {
      transition: 0.25s;
    }

    .socials a:hover {
      color: var(--red);
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        padding-top: 130px;
      }

      .profile-wrap {
        justify-content: flex-start;
      }
    }

    @media (max-width: 650px) {
      nav {
        padding: 17px 5%;
      }

      .hero {
        padding-left: 5%;
        padding-right: 5%;
        padding-top: 120px;
        padding-bottom: 60px;
      }

      .hero h1 {
        letter-spacing: -3px;
      }

      .profile-image {
        height: 350px;
      }

      footer {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }

      .nav-right {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- ================= NAVBAR ================= -->

  <nav>

    <a href="#" class="logo">
      RAJA<span></span>
    </a>

    <div class="nav-right">
      <span class="nav-dot"></span>
      Terhubung Ke Jaringan
    </div>

  </nav>


  <!-- ================= HERO ================= -->

  <main>

    <section class="hero">

      <div class="hero-content">

        <div class="eyebrow">
          Hello, I'm
        </div>

        <h1>
          My Name Is<br>
          <span>Raja</span>
        </h1>

        <p class="hero-description">
          Edisi Gabut
        </p>

        <div class="buttons">

          <a href="https://wa.me/rajaqul" class="btn btn-primary">
            Hubungi Saya
          </a>

          <a href="#" class="btn btn-outline">
            Pajangan Bae
          </a>

        </div>

      </div>


      <!-- ================= PROFILE ================= -->

      <div class="profile-wrap">

        <div class="profile-card">

          <div class="profile-image">
            <img src="image.jpg" alt="Raja">
          </div>

          <div class="profile-info">

            <div>
              <h3>Raja</h3>
              <p>Orang Gabut Sedunia</p>
            </div>

            <div class="status"></div>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- ================= FOOTER ================= -->

  <footer>

    <div>
      © 2026 Raja All rights reserved.
    </div>

  </footer>

</body>
</html>
